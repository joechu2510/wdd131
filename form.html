<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="author" content="Joe Chu">
    <meta name="description" content="Submit your product review and share your feedback with us. Help us maintain high quality standards by rating your experience and suggesting improvements for our products.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get" class="review-form">
            
            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating <span class="required">*</span></label>
                <div class="rating-group">
                    <label class="rating-label">
                        <input type="radio" id="rating1" name="overallRating" value="1" required>
                        <span class="stars">☆</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" id="rating2" name="overallRating" value="2" required>
                        <span class="stars">☆☆</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" id="rating3" name="overallRating" value="3" required>
                        <span class="stars">☆☆☆</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" id="rating4" name="overallRating" value="4" required>
                        <span class="stars">☆☆☆☆</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" id="rating5" name="overallRating" value="5" required>
                        <span class="stars">☆☆☆☆☆</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="installationDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installationDate" name="installationDate" required>
            </div>

            <div class="form-group">
                <label>Which features did you find useful in the product? <span>(Check all that apply)</span></label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="featDurability" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="featEase" name="features" value="ease_of_use"> Ease of Use</label>
                    <label><input type="checkbox" id="featPerformance" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" id="featDesign" name="features" value="design"> Design</label>
                </div>
            </div>

            <div class="form-group">
                <label for="writtenReview">Written Review <span>(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span>(Optional)</span></label>
                <input type="text" id="userName" name="userName" placeholder="e.g., John Doe">
            </div>

            <button type="submit" class="submit-btn">Post Review</button>

        </form>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> | Joe Chu | Lima-Peru</p>
        <p id="lastModified"> </p>
    </footer>

</body>
</html>
