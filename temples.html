<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <p>Temple Album</p>
        <button id="menuButton" aria-label="Toggle Menu">☰</button>
        <nav>
            <ul>
                <li><a href="#Home">Home</a></li>
                <li><a href="#Old">Old</a></li>
                <li><a href="#New">New</a></li>
                <li><a href="#Large">Large</a></li>
                <li><a href="#Small">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Home</h1>
        <div class="gallery">
            <figure>
                <img src="images/lima_peru.jpg" alt="lima peru temple">
                <figcaption>Lima Peru</figcaption>
            </figure>
            <figure>
                <img src="images/olivos_peru.jpg" alt="los olivos peru temple">
                <figcaption>Los Olivos Peru</figcaption>
            </figure>
            <figure>
                <img src="images/orem_utah.jpg" alt="orem utah temple">
                <figcaption>Orem Utah</figcaption>
            </figure>
            <figure>
                <img src="images/provocity_utah.jpg" alt="provo city temple">
                <figcaption>Provo City Utah</figcaption>
            </figure>
            <figure>
                <img src="images/saltlakecity_utah.jpg" alt="salt lake city temple">
                <figcaption>Salk Lake City Utah</figcaption>
            </figure>
            <figure>
                <img src="images/rome_italy.jpg" alt="rome italy temple">
                <figcaption>Rome Italy</figcaption>
            </figure>
            <figure>
                <img src="images/taipei_taiwan.jpg" alt="taipei taiwan temple">
                <figcaption>Taipei Taiwan</figcaption>
            </figure>
            <figure>
                <img src="images/washington_temple.jpg" alt="washington dc temple">
                <figcaption>Washington DC</figcaption>
            </figure>
            <figure>
                <img src="images/trujillo_peru.jpg" alt="trujillo peru temple">
                <figcaption>Trujillo Peru</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> | Joe Chu | Lima-Peru</p>
        <p id="lastModified"> </p>
    </footer>
</body>
</html>
